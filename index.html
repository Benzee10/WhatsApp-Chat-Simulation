    <title>QuickChat Finder - Find Active Chat Partners</title>

    <style>
      @keyframes pulse-green {
        0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
        50% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(37, 211, 102, 0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes bounceIn {
        0% { opacity: 0; transform: scale(0.3); }
        50% { opacity: 1; transform: scale(1.05); }
        70% { transform: scale(0.9); }
        100% { transform: scale(1); }
      }
      @keyframes bounce-subtle {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      @keyframes loading {
        0% { width: 0%; }
        100% { width: 100%; }
      }
      @keyframes typingDot {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
        40% { transform: translateY(-4px); opacity: 1; }
      }
      .typing-dot-1 { animation: typingDot 1.2s infinite ease-in-out; }
      .typing-dot-2 { animation: typingDot 1.2s infinite ease-in-out 0.2s; }
      .typing-dot-3 { animation: typingDot 1.2s infinite ease-in-out 0.4s; }
      .animate-fadeIn {
        animation: fadeIn 0.5s ease-out forwards;
      }
      .animate-bounceIn {
        animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
      .animate-pulse-green {
        animation: pulse-green 2s infinite;
      }
      .animate-bounce-subtle {
        animation: bounce-subtle 2s infinite ease-in-out;
      }
      @keyframes checkmarkScale {
        0% { transform: scale(0.6); opacity: 0; }
        60% { transform: scale(1.1); }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes checkmarkDraw {
        0% { stroke-dashoffset: 48; }
        100% { stroke-dashoffset: 0; }
      }
      .animate-checkmark-scale {
        animation: checkmarkScale 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
      .animate-checkmark-draw {
        stroke-dasharray: 48;
        stroke-dashoffset: 48;
        animation: checkmarkDraw 0.5s ease-out 0.2s forwards;
      }
      .whatsapp-bg { background-color: #ece5dd !important; }
      .whatsapp-teal { background-color: #128C7E; }
      .whatsapp-green { background-color: #25D366; }
      .whatsapp-green-text { color: #25D366; }
      
      /* Ensure root takes full height */
      #root { min-height: 100vh; display: flex; flex-direction: column; }
    </style>
